<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>LakshyaGram</title>
  <meta name="description" content="Your LakshyaGram chats."/>
  <meta name="theme-color" content="#0A1F38"/>
  <meta name="robots" content="noindex"/>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://api.fontshare.com"/>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin/>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600&display=swap"/>
  <link rel="stylesheet" href="css/tokens.css"/>
  <link rel="stylesheet" href="css/app.css"/>
  <script>
    try { if (localStorage.getItem('lg_dark_mode') === 'false') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js" } }
  </script>
</head>
<body>

<div class="boot" id="boot" aria-live="polite">
  <img src="assets/mark.svg" alt="" width="64" height="64"/>
  <span>Opening your chats…</span>
</div>

<div class="shell" id="shell" hidden>
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="side" id="side" aria-label="Chats">
    <div class="side-top">
      <a class="brand" href="index.html" aria-label="LakshyaGram home">
        <img src="assets/mark.svg" alt="" width="28" height="28"/><span>LakshyaGram</span>
      </a>
      <div class="side-actions">
        <button class="icon-btn" id="mode-btn" aria-label="Switch to light mode" title="Light or dark">
          <svg class="i-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn gold" id="new-chat-btn" aria-label="Start a chat" title="Start a chat">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="side-search" placeholder="Search chats and people" aria-label="Search chats and people"/>
      <kbd>Ctrl K</kbd>
    </label>

    <div class="seg" role="tablist" aria-label="Lists">
      <button role="tab" aria-selected="true" data-view="chats">Chats</button>
      <button role="tab" aria-selected="false" data-view="people">People</button>
      <button role="tab" aria-selected="false" data-view="starred">Starred</button>
    </div>

    <div class="lists">
      <div class="list" id="list-chats" data-view="chats"></div>
      <div class="list" id="list-people" data-view="people" hidden></div>
      <div class="list" id="list-starred" data-view="starred" hidden></div>
    </div>

    <div class="me" id="me">
      <button class="me-btn" id="profile-btn" aria-label="Edit your profile">
        <span class="av" id="me-av"></span>
        <span class="me-text"><b id="me-name">…</b><small id="me-status"></small></span>
      </button>
      <button class="icon-btn" id="admin-btn" aria-label="Admin" title="Admin" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </button>
      <button class="icon-btn" id="signout-btn" aria-label="Sign out" title="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main" id="main">
    <!-- empty -->
    <section class="empty" id="empty" aria-labelledby="empty-title">
      <div class="empty-stage"><canvas id="empty-canvas" aria-hidden="true"></canvas></div>
      <h1 id="empty-title">Pick a chat, or start one</h1>
      <p>Your conversations live on the left. Lakshya AI is always there if you want to ask something.</p>
      <div class="empty-actions">
        <button class="btn" id="empty-new">Start a chat</button>
        <button class="btn quiet" id="empty-ai">Ask Lakshya AI</button>
      </div>
    </section>

    <!-- conversation -->
    <section class="convo" id="convo" hidden aria-labelledby="c-name">
      <header class="c-head">
        <button class="icon-btn back" id="back-btn" aria-label="Back to chats">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="c-who" id="c-who" aria-label="Contact info">
          <span class="av" id="c-av"></span>
          <span class="c-text"><h2 id="c-name">—</h2><small id="c-status"></small></span>
        </button>
        <div class="c-actions">
          <button class="icon-btn" id="find-btn" aria-label="Search in this chat" title="Search in this chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button class="icon-btn" id="pin-btn" aria-label="Pin this chat" aria-pressed="false" title="Pin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 4 4v2H6v-2l4-4z"/></svg>
          </button>
          <button class="icon-btn" id="theme-btn" aria-label="Chat theme" aria-expanded="false" title="Chat theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <div class="find" id="find" hidden>
        <input type="search" id="find-input" placeholder="Search in this chat" aria-label="Search in this chat"/>
        <span id="find-count"></span>
        <button class="icon-btn" id="find-close" aria-label="Close search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="themes" id="themes" hidden role="listbox" aria-label="Chat theme">
        <button role="option" data-theme="target" style="--sw:#0A1F38">Target</button>
        <button role="option" data-theme="ocean" style="--sw:#0B3F4F">Ocean</button>
        <button role="option" data-theme="forest" style="--sw:#163D24">Forest</button>
        <button role="option" data-theme="ember" style="--sw:#5A2416">Ember</button>
        <button role="option" data-theme="sakura" style="--sw:#4D1D39">Sakura</button>
        <button role="option" data-theme="midnight" style="--sw:#10151E">Midnight</button>
      </div>

      <div class="scroller" id="scroller">
        <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Messages"></div>
        <div class="typing-row" id="typing" hidden><span class="typing"><i></i><i></i><i></i></span><span id="typing-name"></span></div>
      </div>
      <button class="to-bottom" id="to-bottom" hidden aria-label="Jump to newest">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </button>

      <div class="drop-zone" id="drop-zone" hidden><span>Drop the photo to send it</span></div>

      <footer class="composer" id="composer">
        <div class="reply-bar" id="reply-bar" hidden>
          <span class="reply-text"><b id="reply-name"></b><span id="reply-snippet"></span></span>
          <button class="icon-btn" id="reply-cancel" aria-label="Cancel reply">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="emoji" id="emoji" hidden></div>
        <div class="compose-row">
          <button class="icon-btn" id="emoji-btn" aria-label="Emoji" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3"/></svg>
          </button>
          <button class="icon-btn" id="photo-btn" aria-label="Send a photo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
          </button>
          <input type="file" id="photo-input" accept="image/*" hidden/>
          <textarea id="input" rows="1" placeholder="Write a message" aria-label="Write a message"></textarea>
          <button class="send" id="send-btn" aria-label="Send">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13"/><path d="m12 6 6 6-6 6"/><path d="M4 9l-2 3 2 3"/></svg>
          </button>
        </div>
      </footer>
    </section>

    <!-- admin -->
    <section class="admin" id="admin" hidden aria-labelledby="admin-title"></section>
  </main>
</div>

<!-- message menu -->
<div class="menu" id="menu" role="menu" hidden>
  <div class="menu-reacts" id="menu-reacts"></div>
  <button role="menuitem" data-act="reply">Reply</button>
  <button role="menuitem" data-act="star">Star</button>
  <button role="menuitem" data-act="copy">Copy text</button>
  <button role="menuitem" data-act="edit">Edit</button>
  <button role="menuitem" data-act="delete" class="danger">Delete</button>
</div>

<!-- dialogs -->
<dialog class="sheet" id="new-chat" aria-labelledby="new-chat-title">
  <div class="sheet-head"><h2 id="new-chat-title">Start a chat</h2><form method="dialog"><button class="icon-btn" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form></div>
  <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="new-chat-search" placeholder="Search by name or email" aria-label="Search by name or email"/></label>
  <div class="list" id="new-chat-list"></div>
</dialog>

<dialog class="sheet" id="profile" aria-labelledby="profile-title">
  <div class="sheet-head"><h2 id="profile-title">Your profile</h2><form method="dialog"><button class="icon-btn" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form></div>
  <form class="form" id="profile-form">
    <div class="profile-av"><span class="av xl" id="profile-av"></span><div class="hues" id="hues" role="radiogroup" aria-label="Avatar colour"></div></div>
    <label>Name<input name="name" required maxlength="40"/></label>
    <label>Bio<input name="bio" maxlength="80" placeholder="Tell people a little about you"/></label>
    <label>Status
      <select name="status">
        <option>Active now</option><option>In class</option><option>In a meeting</option><option>Focusing</option><option>Away</option>
      </select>
    </label>
    <button class="btn" type="submit">Save profile</button>
  </form>
</dialog>

<dialog class="sheet" id="contact" aria-labelledby="contact-name">
  <div class="sheet-head"><span></span><form method="dialog"><button class="icon-btn" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form></div>
  <div class="contact-body">
    <span class="av xl" id="contact-av"></span>
    <h2 id="contact-name"></h2>
    <p id="contact-status"></p>
    <p id="contact-bio" class="contact-bio"></p>
    <p id="contact-email" class="contact-email"></p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
